  .dark\:bg-night:where(.dark, .dark *) {
    background-color: var(--color-night);
  }
  .dark\:bg-night\/80:where(.dark, .dark *) {
    background-color: color-mix(in srgb, #202b2b 80%, transparent);
    @supports (color: color-mix(in lab, red, red)) {
      background-color: color-mix(in oklab, var(--color-night) 80%, transparent);
    }
  }
  .dark\:bg-white\/5:where(.dark, .dark *) {
    background-color: color-mix(in srgb, #fff 5%, transparent);
    @supports (color: color-mix(in lab, red, red)) {
      background-color: color-mix(in oklab, var(--color-white) 5%, transparent);
    }
  }
  .dark\:bg-white\/10:where(.dark, .dark *) {
    background-color: color-mix(in srgb, #fff 10%, transparent);
    @supports (color: color-mix(in lab, red, red)) {
      background-color: color-mix(in oklab, var(--color-white) 10%, transparent);
    }
  }
  .dark\:text-slate-400:where(.dark, .dark *) {
    color: var(--color-slate-400);
  }
  @media print {
    .print\:hidden {
      display: none;
    }
  }
}
@layer base {
  body {
    background-color: var(--color-bg);
    font-family: var(--font-sans);
    color: var(--color-slate-800);
    &:where(.dark, .dark *) {
      background-color: var(--color-night);
    }
    &:where(.dark, .dark *) {
      color: var(--color-slate-100);
    }
  }
}
